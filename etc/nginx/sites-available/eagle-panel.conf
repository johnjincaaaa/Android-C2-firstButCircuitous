# 雄鹰面板（192.238.176.7 / .12）: kkyk1688.cc 主域名 + zxg123.com 并存 -> 127.0.0.1:39445
# HTTP: acme 验证 + 跳转 HTTPS
server {
    listen 192.238.176.7:80;
    listen 192.238.176.12:80;
    server_name kkyk1688.cc zxg123.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS: kkyk1688.cc（主）
server {
    listen 192.238.176.7:443 ssl http2;
    listen 192.238.176.12:443 ssl http2;
    server_name kkyk1688.cc;

    ssl_certificate /etc/letsencrypt/live/kkyk1688.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkyk1688.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200M;

    include /etc/nginx/snippets/eagle_php.conf;

    location / {
        proxy_pass http://127.0.0.1:39445;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# HTTPS: zxg123.com（并存）
server {
    listen 192.238.176.7:443 ssl http2;
    listen 192.238.176.12:443 ssl http2;
    server_name zxg123.com;

    ssl_certificate /etc/letsencrypt/live/zxg123.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zxg123.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200M;

    include /etc/nginx/snippets/eagle_php.conf;

    location / {
        proxy_pass http://127.0.0.1:39445;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

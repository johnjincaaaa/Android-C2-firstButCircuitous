    # 构建器上传图标 → PHP（JWT 同源验签 + 图片魔数校验）
    location ~ "^/m/upload/asset/[A-Za-z0-9_-]{1,32}$" {
        client_max_body_size 60m;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/eagle_php/upload_asset.php;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
    }
    # 构建产物下载 → PHP（JWT + X-Accel 零拷贝直发）
    location ~ "^/m/build/[0-9]{1,18}/download$" {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/eagle_php/build_download.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
    }
    # X-Accel 内部直发
    location ^~ /__eagle_dl/ {
        internal;
        alias /root/xyzcs_front/uploads/;
        types { }
        default_type application/vnd.android.package-archive;
        gzip off;
    }
